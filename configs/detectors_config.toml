# This config supports the use of placeholders.
# options are, e.g., all keys from your local 'machine_specific_paths.toml'

# gaze_individual
[algorithms.multiview_eth_xgaze]
camera_names = ["<cur_cam_face1>", "<cur_cam_face2>", "<cur_cam_top>", "<cur_cam_front>"]
env_name = "venv:multiview_eth_xgaze"
log_frame_idx_interval = 200
filtered = true
window_length = 11
polyorder = 2
visualize = true

[algorithms.multiview_eth_xgaze.required_assets]
shape_predictor_filename = "<assets>/multiview_eth_xgaze/shape_predictor_68_face_landmarks.dat"
face_model_filename = "<assets>/multiview_eth_xgaze/face_model.txt"
pretrained_model_filename = "<assets>/multiview_eth_xgaze/epoch_24_ckpt.pth.tar"
face_detector_filename = "<assets>/multiview_eth_xgaze/mmod_human_face_detector.dat"

# body_joints, hand_joints, face_landmarks
[frameworks.mmpose]
camera_names = ["<cur_cam_top>", "<cur_cam_front>"]
env_name = "conda:openmmlab"
save_detector_images = true
save_detector_predictions = true
device = "cuda:0"
filtered = true
window_length = 11
polyorder = 2
visualize = true

[algorithms.hrnetw48]
framework = "mmpose"
pose_config = "td-hm_hrnet-w48_8xb32-210e_coco-wholebody-384x288"
keypoint_mapping = "coco_wholebody"
min_detection_confidence = 0.5

[algorithms.hrnetw48.required_assets]
pose_checkpoint = "<assets>/mmpose/configs/hrnet_w48_coco_wholebody_384x288_dark-f5726563_20200918.pth"
detection_config = "<assets>/mmpose/configs/faster_rcnn_r50_fpn_coco.py"
detection_checkpoint = "<assets>/mmpose/configs/faster_rcnn_r50_fpn_1x_coco_20200130-047c8118.pth"

[algorithms.vitpose]
framework = "mmpose"
pose_config = "td-hm_ViTPose-large_8xb64-210e_coco-256x192"
keypoint_mapping = "coco_wholebody"
min_detection_confidence = 0.5

[algorithms.vitpose.required_assets]
pose_checkpoint = "<assets>/mmpose/configs/td-hm_ViTPose-large_8xb64-210e_coco-256x192-53609f55_20230314.pth"
detection_config = "<assets>/mmpose/configs/faster_rcnn_r50_fpn_coco.py"
detection_checkpoint = "<assets>/mmpose/configs/faster_rcnn_r50_fpn_1x_coco_20200130-047c8118.pth"

[algorithms.rtmpose_l_aic]
framework = "mmpose"
pose_config = "rtmpose-l_8xb256-420e_aic-coco-384x288"
keypoint_mapping = "coco_wholebody"
min_detection_confidence = 0.5

[algorithms.rtmpose_l_aic.required_assets]
pose_config_file = "<assets>/mmpose/configs/rtmpose-l_8xb256-420e_aic-coco-384x288.py"
pose_checkpoint = "<assets>/mmpose/configs/rtmpose-l_simcc-aic-coco_pt-aic-coco_420e-384x288-97d6cb0f_20230228.pth"
detection_config = "<assets>/mmpose/configs/faster_rcnn_r50_fpn_coco.py"
detection_checkpoint = "<assets>/mmpose/configs/faster_rcnn_r50_fpn_1x_coco_20200130-047c8118.pth"

[algorithms.rtmpose_l_wholebody]
framework = "mmpose"
pose_config = "rtmpose-l_8xb32-270e_coco-ubody-wholebody-384x288"
keypoint_mapping = "coco_wholebody"
min_detection_confidence = 0.5

[algorithms.rtmpose_l_wholebody.required_assets]
pose_config_file = "<assets>/mmpose/configs/rtmpose-l_8xb32-270e_coco-ubody-wholebody-384x288.py"
pose_checkpoint = "<assets>/mmpose/configs/rtmpose-l_simcc-coco-wholebody_pt-aic-coco_270e-384x288-eaeb96c8_20230125.pth"
detection_config = "<assets>/mmpose/configs/faster_rcnn_r50_fpn_coco.py"
detection_checkpoint = "<assets>/mmpose/configs/faster_rcnn_r50_fpn_1x_coco_20200130-047c8118.pth"

[algorithms.vitpose_huge]
framework = "mmpose"
pose_config = "td-hm_ViTPose-huge_8xb64-210e_coco-256x192"
keypoint_mapping = "coco_wholebody"
min_detection_confidence = 0.5

[algorithms.vitpose_huge.required_assets]
pose_checkpoint = "<assets>/mmpose/configs/td-hm_ViTPose-huge_8xb64-210e_coco-256x192-e32adcd4_20230314.pth"
detection_config = "<assets>/mmpose/configs/faster_rcnn_r50_fpn_coco.py"
detection_checkpoint = "<assets>/mmpose/configs/faster_rcnn_r50_fpn_1x_coco_20200130-047c8118.pth"


[algorithms.rtmpose_m_mpii]
framework = "mmpose"
pose_config = "rtmpose-m_8xb64-210e_mpii-256x256"
keypoint_mapping = "mpii"
min_detection_confidence = 0.5

[algorithms.rtmpose_m_mpii.required_assets]
pose_config_file = "<assets>/mmpose/configs/rtmpose-m_8xb64-210e_mpii-256x256.py"
pose_checkpoint = "<assets>/mmpose/configs/rtmpose-m_simcc-mpii_pt-aic-coco_210e-256x256-ec4dbec8_20230206.pth"
detection_config = "<assets>/mmpose/configs/faster_rcnn_r50_fpn_coco.py"
detection_checkpoint = "<assets>/mmpose/configs/faster_rcnn_r50_fpn_1x_coco_20200130-047c8118.pth"


# kinematics
[algorithms.velocity_body]
input_detector_names = [["body_joints", "hrnetw48"]]
visualize = true


# proximity
[algorithms.body_distance]
used_keypoints = ["nose"]  # if the list is more than one keypoint, the midpoint
input_detector_names = [["body_joints", "hrnetw48"]]
visualize = true

# gaze_interaction
[algorithms.gaze_distance]
# camera_names = ["3d"]
input_detector_names = [["gaze_multiview", "gaze_fusion"],  ["face_landmarks", "hrnetw48"]]
keypoint_mapping = "coco_wholebody"
threshold_look_at = 0.4
visualize = true

[algorithms.gaze_fusion]
input_detector_names = [["gaze_individual", "multiview_eth_xgaze"]]
fusion_method = "weighted_average"  # options: "average", "weighted_average"
filtered = true
window_length = 11
polyorder = 2
ensemble_enabled = true
# ensemble_weights = [0.5, 0.5]  # TODO should we add this?
visualize = true

# emotion_individual
[algorithms.py_feat]
camera_names = ["<cur_cam_face1>", "<cur_cam_face2>", "<cur_cam_top>", "<cur_cam_front>"]
env_name = "venv:py_feat"
log_frame_idx_interval = 200
# For batch_size, ensure:
# [(batch_size) * (~Size of one frame (GB))] < Available vRAM (RAM) (GB)
batch_size = 512
visualize = true

# head_orientation
[algorithms.spiga]
camera_names = ["<cur_cam_face1>", "<cur_cam_face2>", "<cur_cam_top>", "<cur_cam_front>"]
env_name = "venv:spiga"
log_frame_idx_interval = 200
batch_size = 32
visualize = true
dataset_name = "wflw" # model name, can be wflw, 300wpublic, 300wprivate or merlrav

[algorithms.spiga.required_assets]
model_weights_path = "<assets>/spiga/spiga_<dataset_name>.pt" # path to weights folder

[algorithms.whisper]
track_names = ["room"]
env_name = "venv:nicetoolbox"
visualize = true
